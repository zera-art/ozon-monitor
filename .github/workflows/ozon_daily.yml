name: Ozon Monitor Daily

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 10:00 МСК
  workflow_dispatch:        # Ручной запуск

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_credentials.json

      - name: Run Ozon Monitor
        env:
          OZON_CLIENT_ID:     ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY:       ${{ secrets.OZON_API_KEY }}
          OZON_SHEETS_ID:     ${{ secrets.OZON_SHEETS_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_PATH: google_credentials.json
        run: python main.py
